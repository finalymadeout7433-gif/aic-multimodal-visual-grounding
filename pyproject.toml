[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-baseline-v0"
version = "0.1.2"
description = "A reproducible RGB-only visual grounding baseline for the 2026 AIC challenge."
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "Pillow",
  "PyYAML",
  "torch",
  "transformers",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "gpu: requires the local Florence-2 model and CUDA",
]
